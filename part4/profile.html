<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HBnB - My Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" alt="HBnB Logo" class="logo"></a>
        <nav>
            <a href="place_form.html" class="nav-link" id="add-place-link">Add Place</a>
            <a href="profile.html" class="nav-link" id="profile-link">My Profile</a>
            <a href="register.html" class="login-button" id="register-link">Sign Up</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
            <a href="#" class="login-button" id="logout-link">Logout</a>
        </nav>
    </header>
    <main>
        <section class="form-section">
            <h2>My Profile</h2>
            <div id="profile-info"></div>
            <form id="profile-form">
                <div class="input-group">
                    <label for="profile-first-name">First name:</label>
                    <input type="text" id="profile-first-name" required>
                </div>
                <div class="input-group">
                    <label for="profile-last-name">Last name:</label>
                    <input type="text" id="profile-last-name" required>
                </div>
                <button type="submit" class="login-button">Save Changes</button>
            </form>
        </section>

        <section>
            <h2>My Places</h2>
            <div class="places-grid" id="my-places-list"></div>
        </section>
    </main>
    <footer>
        <p>© 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
