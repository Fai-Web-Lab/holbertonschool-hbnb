<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HBnB - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" alt="HBnB Logo" class="logo"></a>
        <nav>
            <a href="place_form.html" class="nav-link" id="add-place-link">Add Place</a>
            <a href="profile.html" class="nav-link" id="profile-link">My Profile</a>
            <a href="register.html" class="login-button" id="register-link">Sign Up</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
            <a href="#" class="login-button" id="logout-link">Logout</a>
        </nav>
    </header>
    <main>
        <section class="form-section">
            <h2>Create an Account</h2>
            <form id="register-form">
                <div class="input-group">
                    <label for="first-name">First name:</label>
                    <input type="text" id="first-name" required>
                </div>
                <div class="input-group">
                    <label for="last-name">Last name:</label>
                    <input type="text" id="last-name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" minlength="8" required>
                </div>
                <button type="submit" class="login-button">Sign Up</button>
            </form>
            <p class="form-footer-link">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
