<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HBnB - Add / Edit Place</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" alt="HBnB Logo" class="logo"></a>
        <nav>
            <a href="place_form.html" class="nav-link" id="add-place-link">Add Place</a>
            <a href="profile.html" class="nav-link" id="profile-link">My Profile</a>
            <a href="register.html" class="login-button" id="register-link">Sign Up</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
            <a href="#" class="login-button" id="logout-link">Logout</a>
        </nav>
    </header>
    <main>
        <section class="form-section">
            <h2 id="place-form-heading">Add a Place</h2>
            <form id="place-form">
                <div class="input-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" maxlength="100" required>
                </div>
                <div class="input-group">
                    <label for="description">Description:</label>
                    <textarea id="description" rows="4"></textarea>
                </div>
                <div class="input-group">
                    <label for="price">Price per night:</label>
                    <input type="number" id="price" min="0" step="0.01" required>
                </div>
                <div class="input-group">
                    <label for="latitude">Latitude:</label>
                    <input type="number" id="latitude" min="-90" max="90" step="0.000001" required>
                </div>
                <div class="input-group">
                    <label for="longitude">Longitude:</label>
                    <input type="number" id="longitude" min="-180" max="180" step="0.000001" required>
                </div>
                <div class="input-group">
                    <label>Amenities:</label>
                    <div class="amenities-list" id="amenities-list">
                        <p>Loading amenities...</p>
                    </div>
                </div>
                <button type="submit" class="login-button">Save Place</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
