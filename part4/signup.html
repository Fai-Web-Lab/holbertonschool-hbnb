<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="images/logo.png" alt="HBnB Logo" class="logo">
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" class="login-button">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <form id="signup-form" class="form">
                <h2>Create Account</h2>
                
                <div id="error-message" style="color: #ff5a5f; background-color: #ffecec; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; text-align: center; font-size: 14px; border: 1px solid #ff5a5f;"></div>

                <div class="form-group">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                
                <button type="submit" class="submit-button">Sign Up</button>

                <p style="text-align: center; margin-top: 20px; font-size: 14px;">
                    Already have an account? <a href="login.html" style="color: #ff5a5f; text-decoration: none; font-weight: bold;">Login here</a>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Holberton School - All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
