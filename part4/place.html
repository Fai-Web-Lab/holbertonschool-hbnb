<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="images/logo.png" alt="HBnB Logo" class="logo">
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link" class="login-button">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="place-details" class="place-details">
            <div class="place-info">
                <h1 id="place-name">Loading...</h1>
                <p><strong>Host:</strong> <span id="place-host"></span></p>
                <p><strong>Price per night:</strong> $<span id="place-price"></span></p>
                <p><strong>Description:</strong> <span id="place-description"></span></p>
                <p><strong>Amenities:</strong> <span id="place-amenities"></span></p>
            </div>
        </section>

        <section id="reviews">
            <h3>Reviews</h3>
            <div id="reviews-list">
            </div>
        </section>

        <section id="add-review" class="add-review" style="display: none;">
            <h2>Add a Review</h2>
            <form id="review-form" class="form">
                <label for="review-text">Your Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <button type="submit" class="submit-button">Submit Review</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Holberton School - All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
