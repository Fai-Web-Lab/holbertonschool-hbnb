<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="logo.png" alt="HBnB Logo" class="logo">
        </a>
        <nav>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <article class="place-details">
            <div class="place-info">
                <h1>Cozy Apartment</h1>
                <p><strong>Host:</strong> John Doe</p>
                <p><strong>Price per night:</strong> $100</p>
                <p><strong>Description:</strong> A beautiful and cozy apartment.</p>
                <p><strong>Amenities:</strong> WiFi, Kitchen, AC, TV</p>
            </div>
            <h2>Reviews</h2>
            <div class="reviews-list">
                <div class="review-card">
                    <p><strong>Jane Smith</strong> (5/5)</p>
                    <p>"Amazing place! Highly recommended."</p>
                </div>
            </div>
            <div class="add-review">
                <a href="add_review.html" class="details-button">Add a Review</a>
            </div>
        </article>
    </main>
    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
</body>
</html>
