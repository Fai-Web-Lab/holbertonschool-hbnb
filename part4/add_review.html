<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HBnB - Add Review</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html" style="margin-right: 15px; text-decoration: none; color: #333;">Home</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>
    <main>
        <section class="form-section" style="max-width: 600px; margin: 40px auto; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 10px;">
            <h2>Add a Review</h2>
            <form id="review-form">
                <div class="input-group" style="margin-bottom: 15px;">
                    <label for="review-text" style="display: block; margin-bottom: 5px;">Your Review:</label>
                    <textarea id="review-text" rows="5" required style="width: 100%; border-radius: 5px; border: 1px solid #ddd; padding: 10px; font-family: inherit;"></textarea>
                </div>
                <button type="submit" class="login-button" style="border: none; cursor: pointer;">Submit Review</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
