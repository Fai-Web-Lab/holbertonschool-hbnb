<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HBnB - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" alt="HBnB Logo" class="logo"></a>
        <nav>
            <a href="place_form.html" class="nav-link" id="add-place-link">Add Place</a>
            <a href="profile.html" class="nav-link" id="profile-link">My Profile</a>
            <a href="register.html" class="login-button" id="register-link">Sign Up</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
            <a href="#" class="login-button" id="logout-link">Logout</a>
        </nav>
    </header>
    <main>
        <section class="controls">
            <label for="search-input">Search:</label>
            <input type="text" id="search-input" placeholder="Search by title...">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="All">All</option>
                <option value="10">$10</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
            </select>
        </section>
        <section class="places-grid" id="places-list">
        </section>
    </main>
    <footer>
        <p>© 2026 HBnB. All rights reserved.</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
