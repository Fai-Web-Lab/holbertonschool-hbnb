<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="images/logo.png" alt="HBnB Logo" class="logo">
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" class="login-button">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="filter">
            <form>
                <label for="country-filter">Filter by Country:</label>
                <select id="country-filter">
                    <option value="all">All Countries</option>
                    </select>
            </form>
        </section>

        <section id="places-list">
            <article class="place-card">
                <h2>Beautiful Apartment</h2>
                <p><strong>Price per night:</strong> $100</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Cozy Studio</h2>
                <p><strong>Price per night:</strong> $85</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Luxury Villa</h2>
                <p><strong>Price per night:</strong> $250</p>
                <a href="place.html" class="details-button">View Details</a>
            </article>
        </section>
    </main>

    <footer>
        <p>© 2026 Holberton School - All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
