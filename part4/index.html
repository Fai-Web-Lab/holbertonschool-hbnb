<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - List of Places</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="images/logo.png" alt="HBnB Logo" class="logo">
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html" id="login-link" class="login-button">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="filter">
            <form>
                <label for="price-filter">Filter by Max Price:</label>
                <select id="price-filter">
                    <option value="All">All</option>
                    <option value="10">10$</option>
                    <option value="50">50$</option>
                    <option value="100">100$</option>
                </select>
            </form>
        </section>

        <section id="places-list">
        </section>
    </main>

    <footer>
        <p>© 2026 Holberton School - All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
